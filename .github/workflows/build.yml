name: Build Windows Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build LumaWave with PyInstaller
        run: python -m PyInstaller --noconfirm --clean LumaWave.spec

      - name: Verify no third-party ICU DLLs are bundled
        shell: pwsh
        run: |
          $icu = Get-ChildItem dist\LumaWave\_internal -Filter icu*
          if ($icu) {
            Write-Error "Unexpected ICU DLLs found: $($icu.Name -join ', ')"
            exit 1
          }

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            if ((Get-Content lumawave\__init__.py -Raw) -match 'APP_VERSION\s*=\s*"([^"]+)"') {
              $ver = $Matches[1]
            } else {
              Write-Error "APP_VERSION not found in lumawave\__init__.py"
              exit 1
            }
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer.iss
          Copy-Item "dist\LumaWave-v${{ steps.version.outputs.version }}-Setup.exe" -Destination "." -Force

      - name: Package LumaWave-Windows-x64.zip & SHA-256 checksums
        shell: pwsh
        run: |
          $zip = "LumaWave-v${{ steps.version.outputs.version }}-Windows-x64.zip"
          $setup = "LumaWave-v${{ steps.version.outputs.version }}-Setup.exe"
          Compress-Archive -Path dist\LumaWave\* -DestinationPath $zip -Force
          @(
            "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip"
            "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  $setup"
          ) | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            LumaWave-v${{ steps.version.outputs.version }}-Windows-x64.zip
            LumaWave-v${{ steps.version.outputs.version }}-Setup.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaWave-v${{ steps.version.outputs.version }}-Windows-x64
          path: |
            LumaWave-v${{ steps.version.outputs.version }}-Windows-x64.zip
            LumaWave-v${{ steps.version.outputs.version }}-Setup.exe
            SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LumaWaveV2 ${{ steps.version.outputs.tag }}
          files: |
            LumaWave-v${{ steps.version.outputs.version }}-Windows-x64.zip
            LumaWave-v${{ steps.version.outputs.version }}-Setup.exe
            SHA256SUMS.txt

