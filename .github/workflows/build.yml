name: Build Windows Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build LumaWave with PyInstaller
        run: python -m PyInstaller --noconfirm --clean LumaWave.spec

      - name: Verify no third-party ICU DLLs are bundled
        shell: pwsh
        run: |
          $icu = Get-ChildItem dist\LumaWave\_internal -Filter icu*
          if ($icu) {
            Write-Error "Unexpected ICU DLLs found: $($icu.Name -join ', ')"
            exit 1
          }

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            if ((Get-Content lumawave\__init__.py -Raw) -match 'APP_VERSION\s*=\s*"([^"]+)"') {
              $ver = $Matches[1]
            } else {
              Write-Error "APP_VERSION not found in lumawave\__init__.py"
              exit 1
            }
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Package LumaWave-Windows-x64.zip & SHA-256 checksum
        shell: pwsh
        run: |
          $zip = "LumaWave-v${{ steps.version.outputs.version }}-Windows-x64.zip"
          Compress-Archive -Path dist\LumaWave\* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: LumaWave-v${{ steps.version.outputs.version }}-Windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaWave-v${{ steps.version.outputs.version }}-Windows-x64
          path: |
            LumaWave-v${{ steps.version.outputs.version }}-Windows-x64.zip
            SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Luma-Wave ${{ steps.version.outputs.tag }}
          files: |
            LumaWave-v${{ steps.version.outputs.version }}-Windows-x64.zip
            SHA256SUMS.txt

